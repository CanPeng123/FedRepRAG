# ScienceQA — centralized and federated experiments
#
# Run:  python run.py --config configs/scienceqa.yaml --stage <stage>
#
# Stages
#   get_embedding     Build FAISS retrieval index from the full training set
#   incontext         In-context retrieval RAG inference
#   mlp_infer         MLP-injected retrieval inference (eval a trained checkpoint)
#   fl_mlp_train      Federated MLP projector training via FedRepRag

#   fl_mlp_infer      FL MLP-injected inference (eval a trained FL checkpoint)

stages:

  get_embedding:
    script: src/VQA/main_ScienceQA/Qwen2dot5VL_Batch_ScienceQA_VQA_get_retrival_embedding.py
    args:
      problems_json:  datasets/ScienceQA/data/scienceqa/split_json/train.json
      images_root:    datasets/ScienceQA/data/scienceqa/images
      split:          train
      model:          qwen2_5-vl-instruct:7b
      batch_size:     1
      out_dir:        output/ScienceQA/train_embedding
    flags: [use_deepspeed, store_embeddings]

  incontext:
    script: src/VQA/main_ScienceQA/Qwen2dot5VL_Batch_ScienceQA_VQA_w_retrival.py
    args:
      train_json:            datasets/ScienceQA/data/scienceqa/split_json/train.json
      val_json:              datasets/ScienceQA/data/scienceqa/split_json/val.json
      test_json:             datasets/ScienceQA/data/scienceqa/split_json/test.json
      images_root:           datasets/ScienceQA/data/scienceqa/images
      eval_on:               test
      split:                 test
      model:                 qwen2_5-vl-instruct:7b
      retrieval_mode:        incontext
      train_embeddings_path: output/ScienceQA/train_embedding/embeddings_train.pt
      top_k:                 5
      retrieved_visual:      none
      batch_size:            1
      out_dir:               output/ScienceQA/incontext_rag_top5
    flags: [use_deepspeed]

  mlp_infer:
    script: src/VQA/main_ScienceQA/Qwen2dot5VL_Batch_ScienceQA_VQA_w_retrival.py
    args:
      train_json:            datasets/ScienceQA/data/scienceqa/split_json/train.json
      val_json:              datasets/ScienceQA/data/scienceqa/split_json/val.json
      test_json:             datasets/ScienceQA/data/scienceqa/split_json/test.json
      images_root:           datasets/ScienceQA/data/scienceqa/images
      eval_on:               test
      split:                 test
      model:                 qwen2_5-vl-instruct:7b
      retrieval_mode:        embed_prefix_w_train
      # retrieval_mlp_ckpt: pass via --retrieval_mlp_ckpt <path>
      train_embeddings_path: output/ScienceQA/train_embedding/embeddings_train.pt
      top_k:                 5
      retrieved_visual:      none
      embedding_output_mode: concat
      batch_size:            1
      out_dir:               output/ScienceQA/mlp_rag_top5
    flags: [use_deepspeed]

  fl_mlp_train:
    script: src/VQA/main_ScienceQA/FL_Qwen2dot5VL_Batch_ScienceQA_VQA_w_retrival_MLP_train.py
    args:
      client_train_dir:         datasets/ScienceQA/data/scienceqa/client_split_train_by_topic_alpha_0dot1
      val_json:                 datasets/ScienceQA/data/scienceqa/split_json/val.json
      test_json:                datasets/ScienceQA/data/scienceqa/split_json/test.json
      client_embeddings_dir:    output/ScienceQA_FL/train_embedding/client_split_train_by_topic_alpha_0dot1
      images_root:              datasets/ScienceQA/data/scienceqa/images
      model_name:               Qwen/Qwen2.5-VL-7B-Instruct
      batch_size:               1
      embedding_output_mode:    concat
      stage1_epochs:            1
      stage1_evidence_topk:     1
      stage1_target_max_tokens: 256
      stage1_lr:                6e-3
      stage1_eval_every:        5000
      stage2_epochs:            1
      stage2_finetune_topk:     5
      stage2_lr:                2e-5
      stage2_eval_every:        5000
      fl_method:                fedRepRag
      comm_rounds:              40
      local_epochs:             1
      eval_client_id:           0
      ckpt_dir:                 output/ScienceQA_FL/mlp_train_fedRepRag
      tb_dir:                   output/ScienceQA_FL/mlp_train_fedRepRag/tensorboard
    flags: [stage1_pretrain, stage2_finetuning, stage2_wo_kl]

  fl_mlp_infer:
    script: src/VQA/main_ScienceQA/Qwen2dot5VL_Batch_ScienceQA_VQA_w_retrival.py
    args:
      train_json:            datasets/ScienceQA/data/scienceqa/split_json/train.json
      val_json:              datasets/ScienceQA/data/scienceqa/split_json/val.json
      test_json:             datasets/ScienceQA/data/scienceqa/split_json/test.json
      images_root:           datasets/ScienceQA/data/scienceqa/images
      eval_on:               test
      split:                 test
      model:                 qwen2_5-vl-instruct:7b
      retrieval_mode:        embed_prefix_w_train
      # retrieval_mlp_ckpt: pass via --retrieval_mlp_ckpt <path>
      train_embeddings_path: output/ScienceQA/train_embedding/embeddings_train.pt
      client_embeddings_dir: output/ScienceQA_FL/train_embedding/client_split_train_by_topic_alpha_0dot1
      top_k:                 5
      retrieved_visual:      none
      embedding_output_mode: concat
      batch_size:            1
      out_dir:               output/ScienceQA_FL/mlp_infer
    flags: [use_deepspeed]